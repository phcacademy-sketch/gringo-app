<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gringo</title><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Gringo"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:#080808;font-family:Arial,sans-serif}.app{max-width:760px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 30px #0002}.mast{height:92px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #333}.brand{text-align:center}.logo{font:700 48px Georgia,serif;letter-spacing:-2px}.add{position:absolute;right:24px;width:42px;height:42px;border:0;border-radius:50%;background:#db3334;color:#fff;font-size:28px;cursor:pointer}.cats{height:48px;background:#000;display:flex;gap:4px;padding:7px 14px;overflow:auto}.cat{white-space:nowrap;border:0;background:transparent;color:#ccc;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.4px;padding:0 12px;cursor:pointer}.cat.active{background:#fff;color:#000}.content{padding:14px 24px 40px}.segments{display:flex;border-bottom:1px solid #bbb}.seg{flex:1;border:0;border-bottom:3px solid transparent;background:#fff;padding:11px;text-transform:uppercase;color:#777;font-size:12px;font-weight:700;cursor:pointer}.seg.active{border-bottom-color:#db3334;color:#000}.search{width:100%;border:0;border-bottom:1px solid #d5d5d5;padding:14px 2px 10px;outline:none;font:15px Georgia,serif}.row{padding:16px 2px;border-bottom:1px solid #c8c8c8;cursor:pointer}.row:hover{background:#fafafa}.title{font:700 20px/1.2 Georgia,serif}.sub{font-size:12px;color:#555;margin-top:4px}.stars{font-size:13px;color:#db3334;margin-top:6px;letter-spacing:1px}.empty{text-align:center;color:#777;padding:70px 20px}dialog{border:0;padding:0;width:min(560px,90vw);box-shadow:0 10px 50px #0005}dialog::backdrop{background:#0008}.modalHead{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid #ddd}.modalTitle{font:700 20px Georgia,serif}.close{border:0;background:none;font-size:20px;cursor:pointer}.details{padding:24px}.detailTitle{font:700 30px Georgia,serif;margin:0 0 8px}.notes{white-space:pre-wrap;line-height:1.5;color:#444;margin-top:18px}.badge{display:inline-block;background:#000;color:#fff;padding:5px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-top:12px}@media(max-width:600px){.app{box-shadow:none}.content{padding:12px 17px}.logo{font-size:40px}.mast{height:78px}}
</style></head><body><main class="app"><header class="mast"><div class="brand"><div class="logo">Gringo</div></div><button class="add" id="importButton" title="Importar biblioteca">⇧</button><input id="importFile" type="file" accept="application/json" hidden></header><nav class="cats" id="cats"></nav><section class="content"><div class="segments" id="segments"></div><input class="search" id="search" placeholder="Pesquisar por título ou autor..."><div id="list"></div></section></main><dialog id="dialog"><div class="modalHead"><span class="modalTitle">Detalhes</span><button class="close" onclick="dialog.close()">×</button></div><div class="details" id="details"></div></dialog><script>
let items=JSON.parse(localStorage.getItem('gringo-items')||'[]');const categories=['Filmes e séries','Podcasts','Livros','Música'];const icons={'Filmes e séries':'🎬','Podcasts':'🎙️','Livros':'📚','Música':'🎵'};const labels={Pendente:{'Filmes e séries':'Para ver',Podcasts:'Para ouvir',Livros:'Para ler','Música':'Para ouvir'},Concluído:{'Filmes e séries':'Vistos',Podcasts:'Ouvidos',Livros:'Lidos','Música':'Ouvidos'}};let category='Filmes e séries',status='Pendente';const cats=document.querySelector('#cats'),segments=document.querySelector('#segments'),list=document.querySelector('#list'),search=document.querySelector('#search'),dialog=document.querySelector('#dialog'),details=document.querySelector('#details');
function draw(){cats.innerHTML=categories.map(c=>'<button class="cat '+(c===category?'active':'')+'" data-c="'+c+'">'+icons[c]+' '+c+'</button>').join('');segments.innerHTML=['Pendente','Concluído'].map(s=>'<button class="seg '+(s===status?'active':'')+'" data-s="'+s+'">'+labels[s][category]+' ('+items.filter(i=>i.category===category&&i.status===s).length+')</button>').join('');const q=search.value.trim().toLowerCase();const visible=items.filter(i=>i.category===category&&i.status===status&&(i.title+' '+i.creator).toLowerCase().includes(q));list.innerHTML=visible.length?visible.map(i=>'<article class="row" data-id="'+i.id+'"><div class="title">'+esc(i.title)+'</div>'+(i.creator?'<div class="sub">'+esc(i.creator)+'</div>':'')+(i.status==='Concluído'?'<div class="stars">'+(i.rating?'★'.repeat(i.rating)+'☆'.repeat(5-i.rating):'Sem avaliação')+'</div>':'')+'</article>').join(''):'<div class="empty">A lista está vazia.</div>';bind()}
function esc(v){return String(v).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function bind(){document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{category=b.dataset.c;search.value='';draw()});document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{status=b.dataset.s;draw()});document.querySelectorAll('[data-id]').forEach(r=>r.onclick=()=>show(items.find(i=>i.id===r.dataset.id)))}function show(i){details.innerHTML='<h1 class="detailTitle">'+esc(i.title)+'</h1>'+(i.creator?'<div>'+esc(i.creator)+'</div>':'')+'<span class="badge">'+esc(i.category)+' · '+esc(i.status)+'</span>'+(i.rating?'<div class="stars">'+'★'.repeat(i.rating)+'☆'.repeat(5-i.rating)+'</div>':'')+(i.notes?'<div class="notes">'+esc(i.notes)+'</div>':'');dialog.showModal()}search.oninput=draw;
const importFile=document.querySelector('#importFile');document.querySelector('#importButton').onclick=()=>importFile.click();
importFile.onchange=async()=>{const file=importFile.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());const incoming=Array.isArray(parsed)?parsed:parsed.items;if(!Array.isArray(incoming))throw new Error();items=incoming;localStorage.setItem('gringo-items',JSON.stringify(items));draw();alert('Biblioteca importada com sucesso.');}catch{alert('Este ficheiro não é uma biblioteca válida do Gringo.')}};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
draw();
</script></body></html>
