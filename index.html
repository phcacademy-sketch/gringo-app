<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Gringo</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gringo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *{box-sizing:border-box;min-width:0}html,body{width:100%;max-width:100%;overflow-x:hidden;background:#000}html{overscroll-behavior-x:none}body{margin:0;color:#f7f7f7;font-family:Arial,sans-serif;-webkit-text-size-adjust:100%;touch-action:pan-y}.app{width:100%;max-width:760px;min-height:100svh;margin:auto;background:#000;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
    .mast{height:92px;padding-top:env(safe-area-inset-top);background:#000;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #282828}.logo{font:700 48px Georgia,serif;letter-spacing:-2px}.tools{position:absolute;right:max(14px,env(safe-area-inset-right));display:flex;gap:8px}.add,.dataMenu{height:42px;border:0;border-radius:14px;color:#fff;cursor:pointer;font-weight:800}.add{width:42px;background:#db3334;font-size:30px}.dataMenu{background:#202020;border:1px solid #383838;padding:0 13px;font-size:12px;text-transform:uppercase}
    .cats{background:#000;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:9px 14px}.cat{min-height:40px;border:1px solid #303030;border-radius:14px;background:#141414;color:#aaa;text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.25px;padding:7px;cursor:pointer;white-space:normal;overflow-wrap:anywhere}.cat.active{background:#f4f4f4;color:#000;border-color:#f4f4f4}
    .content{padding:14px 24px 40px}.segments{display:flex;gap:7px;background:#111;border:1px solid #292929;border-radius:16px;padding:5px}.seg{flex:1;border:0;border-radius:11px;background:transparent;padding:11px 6px;text-transform:uppercase;color:#888;font-size:12px;font-weight:700;cursor:pointer}.seg.active{background:#292929;color:#fff;box-shadow:inset 0 -3px #db3334}.search{display:block;width:100%;border:1px solid #303030;border-radius:14px;background:#151515;color:#fff;padding:13px 14px;outline:none;font:16px Georgia,serif;margin:14px 0}.search::placeholder{color:#777}.row{width:100%;padding:16px;margin:0 0 10px;border:1px solid #292929;border-radius:16px;background:#111;cursor:pointer;overflow:hidden}.row:hover{background:#181818}.title{font:700 20px/1.2 Georgia,serif;color:#fff;overflow-wrap:anywhere}.sub{font-size:12px;color:#aaa;margin-top:5px;overflow-wrap:anywhere}.stars{font-size:14px;color:#db3334;margin-top:7px;letter-spacing:1px}.empty{text-align:center;color:#777;padding:70px 20px}
    dialog{border:1px solid #333;border-radius:22px;padding:0;width:min(560px,calc(100vw - 24px));max-width:calc(100vw - 24px);max-height:92svh;background:#0d0d0d;color:#fff;box-shadow:0 18px 70px #000;overflow:hidden}dialog::backdrop{background:#000c}.modalHead{display:flex;align-items:center;justify-content:space-between;padding:18px;border-bottom:1px solid #292929;position:sticky;top:0;background:#0d0d0d;z-index:2}.modalTitle{font:700 20px Georgia,serif}.close{width:34px;height:34px;border:1px solid #383838;border-radius:11px;background:#191919;color:#fff;font-size:20px;cursor:pointer}.details{padding:24px;max-height:calc(92svh - 71px);overflow-y:auto;overflow-x:hidden}.itemForm,.dataPanel{display:grid;gap:16px}.field{display:grid;gap:7px;color:#aaa;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}.field input,.field textarea{display:block;width:100%;border:1px solid #353535;border-radius:13px;background:#171717;color:#fff;padding:12px;font:16px Arial,sans-serif;text-transform:none}.field input::placeholder,.field textarea::placeholder{color:#666}.field input:focus,.field textarea:focus{outline:1px solid #db3334;border-color:#db3334}.field textarea{min-height:95px;resize:vertical}.pillrow,.stateRow{display:flex;flex-wrap:wrap;gap:7px}.pill,.stateButton{white-space:normal;border:1px solid #343434;border-radius:12px;background:#171717;color:#aaa;padding:10px 12px;font-weight:700;cursor:pointer}.pill{flex:1 1 calc(50% - 7px)}.pill.active,.stateButton.active{background:#f3f3f3;color:#000;border-color:#f3f3f3}.stateButton{flex:1}.stateButton.active{box-shadow:inset 0 -3px #db3334}.starpick{display:flex;max-width:100%}.starButton{flex:0 1 52px;border:0;background:none;color:#3c3c3c;font-size:34px;padding:0;cursor:pointer}.starButton.active{color:#db3334}.save,.delete,.dataAction{width:100%;border-radius:14px;padding:14px;font-weight:800;text-transform:uppercase;cursor:pointer}.save{border:0;background:#db3334;color:#fff}.delete{border:1px solid #db3334;background:#111;color:#db3334;margin-top:10px}.dataAction{border:1px solid #383838;background:#171717;color:#fff;text-align:left}.dataAction.primary{background:#db3334;border-color:#db3334}.dataHelp{margin:0;color:#888;font-size:13px;line-height:1.45}.dataDivider{height:1px;background:#292929}.profileName{display:block;width:100%;border:1px solid #353535;border-radius:13px;background:#171717;color:#fff;padding:12px;font-size:16px}
    @media(max-width:600px){.mast{height:calc(78px + env(safe-area-inset-top))}.logo{font-size:38px}.tools{right:max(9px,env(safe-area-inset-right));gap:6px}.add{width:36px;height:36px;border-radius:12px}.dataMenu{height:36px;border-radius:12px;padding:0 10px;font-size:10px}.cats{grid-template-columns:repeat(2,minmax(0,1fr));padding:9px 10px}.cat{min-height:36px}.content{padding:12px max(14px,env(safe-area-inset-right)) 32px max(14px,env(safe-area-inset-left))}.details{padding:20px}.seg{font-size:11px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="mast">
      <div class="logo">Gringo</div>
      <div class="tools"><button class="dataMenu" id="dataButton">Dados</button><button class="add" id="addButton" title="Adicionar item">+</button></div>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </header>
    <nav class="cats" id="cats"></nav>
    <section class="content"><div class="segments" id="segments"></div><input class="search" id="search" placeholder="Pesquisar por título ou autor..."><div id="list"></div></section>
  </main>
  <dialog id="dialog"><div class="modalHead"><span class="modalTitle" id="modalTitle">Detalhes</span><button class="close" id="closeDialog">×</button></div><div class="details" id="details"></div></dialog>
  <script>
    let items=JSON.parse(localStorage.getItem('gringo-items')||'[]');
    const categories=['Filmes e séries','Podcasts','Livros','Música'];
    const labels={Pendente:{'Filmes e séries':'Para ver',Podcasts:'Para ouvir',Livros:'Para ler','Música':'Para ouvir'},Concluído:{'Filmes e séries':'Vistos',Podcasts:'Ouvidos',Livros:'Lidos','Música':'Ouvidos'}};
    let category='Filmes e séries',status='Pendente';
    const cats=document.querySelector('#cats'),segments=document.querySelector('#segments'),list=document.querySelector('#list'),search=document.querySelector('#search'),dialog=document.querySelector('#dialog'),details=document.querySelector('#details'),importFile=document.querySelector('#importFile');
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function persist(){localStorage.setItem('gringo-items',JSON.stringify(items))}
    function draw(){
      cats.innerHTML=categories.map(c=>'<button class="cat '+(c===category?'active':'')+'" data-c="'+c+'">'+c+'</button>').join('');
      segments.innerHTML=['Pendente','Concluído'].map(s=>'<button class="seg '+(s===status?'active':'')+'" data-s="'+s+'">'+labels[s][category]+' ('+items.filter(i=>i.category===category&&i.status===s).length+')</button>').join('');
      const q=search.value.trim().toLowerCase();
      const visible=items.filter(i=>i.category===category&&i.status===status&&((i.title||'')+' '+(i.creator||'')).toLowerCase().includes(q));
      list.innerHTML=visible.length?visible.map(i=>'<article class="row" data-id="'+esc(i.id)+'"><div class="title">'+esc(i.title)+'</div>'+(i.creator?'<div class="sub">'+esc(i.creator)+'</div>':'')+(i.status==='Concluído'?'<div class="stars">'+(i.rating?'★'.repeat(i.rating)+'☆'.repeat(5-i.rating):'Sem avaliação')+'</div>':'')+'</article>').join(''):'<div class="empty">A lista está vazia.</div>';
      document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{category=b.dataset.c;search.value='';draw()});
      document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{status=b.dataset.s;draw()});
      document.querySelectorAll('[data-id]').forEach(r=>r.onclick=()=>openEditor(items.find(i=>String(i.id)===r.dataset.id)));
    }
    function openEditor(item){
      const editing=!!item;let draft=editing?{...item}:{id:'',title:'',creator:'',notes:'',category,status,rating:0};
      document.querySelector('#modalTitle').textContent=editing?'Editar item':'Novo item';
      details.innerHTML='<form class="itemForm" id="itemForm"><div class="field">Categoria<div class="pillrow">'+categories.map(c=>'<button type="button" class="pill" data-value="'+c+'">'+c+'</button>').join('')+'</div></div><label class="field">Título *<input id="editTitle" required></label><label class="field">Autor, artista ou criador<input id="editCreator" placeholder="Opcional"></label><div class="field">Estado<div class="stateRow"><button type="button" class="stateButton" data-status="Pendente"></button><button type="button" class="stateButton" data-status="Concluído"></button></div></div><div class="field">Avaliação<div class="starpick">'+[1,2,3,4,5].map(n=>'<button type="button" class="starButton" data-rating="'+n+'">★</button>').join('')+'</div></div><label class="field">Notas<textarea id="editNotes" placeholder="Comentários ou lembranças..."></textarea></label><button class="save" type="submit">Guardar</button>'+(editing?'<button class="delete" id="deleteItem" type="button">Eliminar item</button>':'')+'</form>';
      const titleInput=document.querySelector('#editTitle'),creatorInput=document.querySelector('#editCreator'),notesInput=document.querySelector('#editNotes');titleInput.value=draft.title||'';creatorInput.value=draft.creator||'';notesInput.value=draft.notes||'';
      function refresh(){document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('active',b.dataset.value===draft.category));document.querySelectorAll('.stateButton').forEach(b=>{b.classList.toggle('active',b.dataset.status===draft.status);b.textContent=labels[b.dataset.status][draft.category]});document.querySelectorAll('.starButton').forEach(b=>b.classList.toggle('active',Number(b.dataset.rating)<=draft.rating))}
      document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{draft.category=b.dataset.value;refresh()});document.querySelectorAll('.stateButton').forEach(b=>b.onclick=()=>{draft.status=b.dataset.status;refresh()});document.querySelectorAll('.starButton').forEach(b=>b.onclick=()=>{draft.rating=Number(b.dataset.rating);refresh()});
      document.querySelector('#itemForm').onsubmit=e=>{e.preventDefault();draft={...draft,title:titleInput.value.trim(),creator:creatorInput.value.trim(),notes:notesInput.value.trim()};if(!draft.title)return;if(editing)items=items.map(i=>i.id===draft.id?draft:i);else{draft.id='item-'+Date.now()+'-'+Math.random();items.unshift(draft)}persist();category=draft.category;status=draft.status;dialog.close();draw()};
      if(editing)document.querySelector('#deleteItem').onclick=()=>{if(confirm('Eliminar “'+draft.title+'”?')){items=items.filter(i=>i.id!==draft.id);persist();dialog.close();draw()}};
      refresh();dialog.showModal();
    }
    function makeExport(){return JSON.stringify({app:'Gringo',version:1,exportedAt:new Date().toISOString(),items},null,2)}
    function downloadFile(file){const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    async function offerFile(file,title,text){if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({title,text,files:[file]});return}catch(e){if(e.name==='AbortError')return}}downloadFile(file)}
    async function exportList(){const file=new File([makeExport()],'gringo-lista-'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});await offerFile(file,'Lista do Gringo','Cópia da minha lista para importar no Gringo.')}
    function profileHtml(name){const grouped=categories.map(c=>{const rows=items.filter(i=>i.category===c).map(i=>'<article><h3>'+esc(i.title)+'</h3>'+(i.creator?'<p>'+esc(i.creator)+'</p>':'')+'<small>'+esc(labels[i.status]?.[c]||i.status)+(i.rating?' · '+i.rating+'/5':'')+'</small></article>').join('');return '<section><h2>'+esc(c)+'</h2>'+(rows||'<p class="empty">Sem itens.</p>')+'</section>'}).join('');return '<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(name)+' · Gringo</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}main{max-width:720px;margin:auto;padding:28px 18px}header{border-bottom:1px solid #333;margin-bottom:28px}h1{font:700 44px Georgia,serif;margin:0 0 6px}header p{color:#999}h2{font:700 25px Georgia,serif;margin-top:34px}article{background:#111;border:1px solid #292929;border-radius:16px;padding:15px;margin:10px 0}h3{font:700 19px Georgia,serif;margin:0 0 5px}article p{color:#aaa;margin:0 0 7px}small{color:#db3334}.empty{color:#777}</style></head><body><main><header><h1>'+esc(name)+'</h1><p>Perfil Gringo · '+items.length+' itens</p></header>'+grouped+'</main></body></html>'}
    async function shareProfile(){const name=(document.querySelector('#profileName').value.trim()||'Meu perfil Gringo');localStorage.setItem('gringo-profile-name',name);const file=new File([profileHtml(name)],'perfil-gringo.html',{type:'text/html'});await offerFile(file,name,'Veja a minha lista no Gringo.')}
    function openData(){document.querySelector('#modalTitle').textContent='Dados e partilha';details.innerHTML='<div class="dataPanel"><p class="dataHelp">A lista fica apenas neste aparelho. Use estas opções para criar uma cópia ou escolher com quem deseja partilhá-la.</p><button class="dataAction" id="importAction">Importar lista</button><button class="dataAction" id="exportAction">Exportar lista</button><div class="dataDivider"></div><label class="field">Nome do perfil<input class="profileName" id="profileName" placeholder="Meu perfil Gringo"></label><button class="dataAction primary" id="shareAction">Partilhar perfil</button><p class="dataHelp">O perfil é uma página somente de leitura. Será enviado apenas depois de escolher uma pessoa ou aplicação no menu de partilha.</p></div>';document.querySelector('#profileName').value=localStorage.getItem('gringo-profile-name')||'';document.querySelector('#importAction').onclick=()=>importFile.click();document.querySelector('#exportAction').onclick=exportList;document.querySelector('#shareAction').onclick=shareProfile;dialog.showModal()}
    importFile.onchange=async()=>{const file=importFile.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());const incoming=Array.isArray(parsed)?parsed:parsed.items;if(!Array.isArray(incoming))throw new Error();items=incoming;persist();dialog.close();draw();alert('Biblioteca importada com sucesso.')}catch{alert('Este ficheiro não é uma biblioteca válida do Gringo.')}finally{importFile.value=''}};
    document.querySelector('#addButton').onclick=()=>openEditor();document.querySelector('#dataButton').onclick=openData;document.querySelector('#closeDialog').onclick=()=>dialog.close();search.oninput=draw;
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
    draw();
  </script>
</body>
</html>
