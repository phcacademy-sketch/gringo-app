<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gringo</title><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Gringo"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:#080808;font-family:Arial,sans-serif}.app{max-width:760px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 30px #0002}.mast{height:92px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #333}.brand{text-align:center}.logo{font:700 48px Georgia,serif;letter-spacing:-2px}.tools{position:absolute;right:18px;display:flex;gap:8px}.add,.import{width:42px;height:42px;border:0;border-radius:50%;color:#fff;cursor:pointer}.add{background:#db3334;font-size:30px}.import{background:#333;font-size:20px}.cats{height:48px;background:#000;display:flex;gap:4px;padding:7px 14px;overflow:auto}.cat{white-space:nowrap;border:0;background:transparent;color:#ccc;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:.4px;padding:0 12px;cursor:pointer}.cat.active{background:#fff;color:#000}.content{padding:14px 24px 40px}.segments{display:flex;border-bottom:1px solid #bbb}.seg{flex:1;border:0;border-bottom:3px solid transparent;background:#fff;padding:11px;text-transform:uppercase;color:#777;font-size:12px;font-weight:700;cursor:pointer}.seg.active{border-bottom-color:#db3334;color:#000}.search{width:100%;border:0;border-bottom:1px solid #d5d5d5;padding:14px 2px 10px;outline:none;font:15px Georgia,serif}.row{padding:16px 2px;border-bottom:1px solid #c8c8c8;cursor:pointer}.row:hover{background:#fafafa}.title{font:700 20px/1.2 Georgia,serif}.sub{font-size:12px;color:#555;margin-top:4px}.stars{font-size:13px;color:#db3334;margin-top:6px;letter-spacing:1px}.empty{text-align:center;color:#777;padding:70px 20px}dialog{border:0;padding:0;width:min(560px,94vw);max-height:92vh;box-shadow:0 10px 50px #0005}dialog::backdrop{background:#0008}.modalHead{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff;z-index:2}.modalTitle{font:700 20px Georgia,serif}.close{border:0;background:none;font-size:20px;cursor:pointer}.details{padding:24px;max-height:calc(92vh - 61px);overflow:auto}.itemForm{display:grid;gap:16px}.field{display:grid;gap:6px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}.field input,.field textarea{width:100%;border:1px solid #bbb;background:#fff;padding:12px;font:16px Arial,sans-serif;text-transform:none}.field textarea{min-height:95px;resize:vertical}.pillrow,.stateRow{display:flex;gap:7px;overflow:auto}.pill,.stateButton{white-space:nowrap;border:1px solid #bbb;background:#fff;padding:9px 11px;font-weight:700;cursor:pointer}.pill.active,.stateButton.active{background:#000;color:#fff;border-color:#000}.stateButton{flex:1}.stateButton.active{border-bottom:3px solid #db3334}.starpick{display:flex;gap:5px}.starButton{border:0;background:none;color:#d8d2c8;font-size:36px;padding:0;cursor:pointer}.starButton.active{color:#db3334}.save{border:0;background:#db3334;color:#fff;padding:14px;font-weight:800;text-transform:uppercase;cursor:pointer}.delete{border:1px solid #db3334;background:#fff;color:#db3334;padding:13px;font-weight:800;text-transform:uppercase;cursor:pointer;margin-top:10px}@media(max-width:600px){.app{box-shadow:none}.content{padding:12px 17px}.logo{font-size:40px}.mast{height:78px}.tools{right:10px}.add,.import{width:36px;height:36px}.details{padding:20px}}
</style></head><body><main class="app"><header class="mast"><div class="brand"><div class="logo">Gringo</div></div><div class="tools"><button class="import" id="importButton" title="Importar biblioteca">⇧</button><button class="add" id="addButton" title="Adicionar item">+</button></div><input id="importFile" type="file" accept="application/json" hidden></header><nav class="cats" id="cats"></nav><section class="content"><div class="segments" id="segments"></div><input class="search" id="search" placeholder="Pesquisar por título ou autor..."><div id="list"></div></section></main><dialog id="dialog"><div class="modalHead"><span class="modalTitle" id="modalTitle">Detalhes</span><button class="close" onclick="dialog.close()">×</button></div><div class="details" id="details"></div></dialog><script>
let items=JSON.parse(localStorage.getItem('gringo-items')||'[]');const categories=['Filmes e séries','Podcasts','Livros','Música'];const icons={'Filmes e séries':'🎬','Podcasts':'🎙️','Livros':'📚','Música':'🎵'};const labels={Pendente:{'Filmes e séries':'Para ver',Podcasts:'Para ouvir',Livros:'Para ler','Música':'Para ouvir'},Concluído:{'Filmes e séries':'Vistos',Podcasts:'Ouvidos',Livros:'Lidos','Música':'Ouvidos'}};let category='Filmes e séries',status='Pendente';const cats=document.querySelector('#cats'),segments=document.querySelector('#segments'),list=document.querySelector('#list'),search=document.querySelector('#search'),dialog=document.querySelector('#dialog'),details=document.querySelector('#details');
function draw(){cats.innerHTML=categories.map(c=>'<button class="cat '+(c===category?'active':'')+'" data-c="'+c+'">'+icons[c]+' '+c+'</button>').join('');segments.innerHTML=['Pendente','Concluído'].map(s=>'<button class="seg '+(s===status?'active':'')+'" data-s="'+s+'">'+labels[s][category]+' ('+items.filter(i=>i.category===category&&i.status===s).length+')</button>').join('');const q=search.value.trim().toLowerCase();const visible=items.filter(i=>i.category===category&&i.status===status&&(i.title+' '+i.creator).toLowerCase().includes(q));list.innerHTML=visible.length?visible.map(i=>'<article class="row" data-id="'+i.id+'"><div class="title">'+esc(i.title)+'</div>'+(i.creator?'<div class="sub">'+esc(i.creator)+'</div>':'')+(i.status==='Concluído'?'<div class="stars">'+(i.rating?'★'.repeat(i.rating)+'☆'.repeat(5-i.rating):'Sem avaliação')+'</div>':'')+'</article>').join(''):'<div class="empty">A lista está vazia.</div>';bind()}
function esc(v){return String(v).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function bind(){document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{category=b.dataset.c;search.value='';draw()});document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{status=b.dataset.s;draw()});document.querySelectorAll('[data-id]').forEach(r=>r.onclick=()=>openEditor(items.find(i=>i.id===r.dataset.id)))}function persist(){localStorage.setItem('gringo-items',JSON.stringify(items))}function openEditor(item){const editing=!!item;let draft=editing?{...item}:{id:'',title:'',creator:'',notes:'',category,status,rating:0};document.querySelector('#modalTitle').textContent=editing?'Editar item':'Novo item';details.innerHTML='<form class="itemForm" id="itemForm"><div class="field">Categoria<div class="pillrow" id="categoryPills">'+categories.map(c=>'<button type="button" class="pill" data-value="'+c+'">'+icons[c]+' '+c+'</button>').join('')+'</div></div><label class="field">Título *<input id="editTitle" required></label><label class="field">Autor, artista ou criador<input id="editCreator" placeholder="Opcional"></label><div class="field">Estado<div class="stateRow"><button type="button" class="stateButton" data-status="Pendente"></button><button type="button" class="stateButton" data-status="Concluído"></button></div></div><div class="field">Avaliação<div class="starpick">'+[1,2,3,4,5].map(n=>'<button type="button" class="starButton" data-rating="'+n+'">★</button>').join('')+'</div></div><label class="field">Notas<textarea id="editNotes" placeholder="Comentários ou lembranças..."></textarea></label><button class="save" type="submit">Guardar</button>'+(editing?'<button class="delete" id="deleteItem" type="button">Eliminar item</button>':'')+'</form>';const titleInput=document.querySelector('#editTitle'),creatorInput=document.querySelector('#editCreator'),notesInput=document.querySelector('#editNotes');titleInput.value=draft.title||'';creatorInput.value=draft.creator||'';notesInput.value=draft.notes||'';function refresh(){document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('active',b.dataset.value===draft.category));document.querySelectorAll('.stateButton').forEach(b=>{b.classList.toggle('active',b.dataset.status===draft.status);b.textContent=labels[b.dataset.status][draft.category]});document.querySelectorAll('.starButton').forEach(b=>b.classList.toggle('active',Number(b.dataset.rating)<=draft.rating))}document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{draft.category=b.dataset.value;refresh()});document.querySelectorAll('.stateButton').forEach(b=>b.onclick=()=>{draft.status=b.dataset.status;refresh()});document.querySelectorAll('.starButton').forEach(b=>b.onclick=()=>{draft.rating=Number(b.dataset.rating);refresh()});document.querySelector('#itemForm').onsubmit=e=>{e.preventDefault();draft={...draft,title:titleInput.value.trim(),creator:creatorInput.value.trim(),notes:notesInput.value.trim()};if(!draft.title)return;if(editing)items=items.map(i=>i.id===draft.id?draft:i);else{draft.id='item-'+Date.now()+'-'+Math.random();items.unshift(draft)}persist();category=draft.category;status=draft.status;dialog.close();draw()};if(editing)document.querySelector('#deleteItem').onclick=()=>{if(confirm('Eliminar “'+draft.title+'”?')){items=items.filter(i=>i.id!==draft.id);persist();dialog.close();draw()}};refresh();dialog.showModal()}document.querySelector('#addButton').onclick=()=>openEditor();search.oninput=draw;
const importFile=document.querySelector('#importFile');document.querySelector('#importButton').onclick=()=>importFile.click();
importFile.onchange=async()=>{const file=importFile.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());const incoming=Array.isArray(parsed)?parsed:parsed.items;if(!Array.isArray(incoming))throw new Error();items=incoming;localStorage.setItem('gringo-items',JSON.stringify(items));draw();alert('Biblioteca importada com sucesso.');}catch{alert('Este ficheiro não é uma biblioteca válida do Gringo.')}};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
draw();
</script></body></html>
